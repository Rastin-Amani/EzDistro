{# Live project status toggle — re-fetched via refreshProjectStatus so the UI
   always reflects server truth after a toggle. Rendered both in the project
   header (full page) and as an HTMX fragment. #}
<span id="project-status-toggle"
      hx-get="/projects/{{ project.id }}/status-toggle"
      hx-trigger="refreshProjectStatus from:body"
      hx-swap="outerHTML"
      class="tooltip tooltip-bottom inline-flex items-center gap-2 rounded-full border border-base-300 px-3 py-1.5"
      data-tip="{{ 'پروژه فعال است؛ در فهرست پروژه‌ها نمایش داده می‌شود' if project.status == 'active' else 'پروژه غیرفعال است؛ از فهرست پروژه‌ها مخفی است' }}">
    <input type="checkbox" class="toggle toggle-sm toggle-success" {% if project.status == 'active' %}checked{% endif %}
           hx-post="/projects/{{ project.id }}/toggle-status"
           hx-trigger="change"
           hx-swap="none"
           aria-label="تغییر وضعیت پروژه" />
    <span class="text-xs font-semibold {{ 'text-success' if project.status == 'active' else 'opacity-50' }}">
        {{ 'فعال' if project.status == 'active' else 'غیرفعال' }}
    </span>
</span>
