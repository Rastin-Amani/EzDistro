<div id="outline-pane" class="flex flex-col gap-1.5">
    {% for s in sections %}
    <div class="border border-base-300/70 rounded-lg p-2 flex flex-col gap-1 {{ 'bg-primary/5' if s.status == 'generating' }}">
        <div class="flex items-center justify-between gap-1">
            <span class="text-xs font-semibold truncate">{{ loop.index }}. {{ s.heading }}</span>
            <span class="badge badge-xs shrink-0 {{ s.status|status_badge }}">{{ s.status|status_label }}</span>
        </div>
        <div class="flex items-center gap-1">
            <a href="#section-{{ s.id }}" class="btn btn-ghost btn-xs p-0 h-5" title="{{ ('Jump to section') }}">{{ ('View') }}</a>
            <form hx-post="/projects/{{ project.id }}/articles/{{ article.id }}/outline/sections/{{ loop.index0 }}/move"
                  hx-swap="none" class="inline">
                <input type="hidden" name="direction" value="up" />
                <button type="submit" class="btn btn-ghost btn-xs p-0 h-5" {{ 'disabled' if loop.first }} title="{{ ('Move up') }}" aria-label="{{ ('Move up') }}">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" /></svg>
                </button>
            </form>
            <form hx-post="/projects/{{ project.id }}/articles/{{ article.id }}/outline/sections/{{ loop.index0 }}/move"
                  hx-swap="none" class="inline">
                <input type="hidden" name="direction" value="down" />
                <button type="submit" class="btn btn-ghost btn-xs p-0 h-5" {{ 'disabled' if loop.last }} title="{{ ('Move down') }}" aria-label="{{ ('Move down') }}">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 8.25 7.5 7.5 7.5-7.5" /></svg>
                </button>
            </form>
            <button class="btn btn-ghost btn-xs p-0 h-5 text-error"
                    hx-post="/projects/{{ project.id }}/articles/{{ article.id }}/outline/sections/{{ loop.index0 }}/delete"
                    hx-swap="none" hx-confirm="{{ ('Delete this section?') }}" title="{{ ('Delete') }}" aria-label="{{ ('Delete section') }}">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
            </button>
        </div>
    </div>
    {% else %}
    <p class="text-xs opacity-50 py-2 text-center">{{ ('No sections yet.') }}</p>
    {% endfor %}

    <details class="border border-dashed border-base-300/70 rounded-lg p-2">
        <summary class="text-xs opacity-70 cursor-pointer">{{ ('+ Add section') }}</summary>
        <form hx-post="/projects/{{ project.id }}/articles/{{ article.id }}/outline/sections/add" hx-swap="none" class="flex flex-col gap-1.5 mt-2">
            <input name="heading" class="input input-xs w-full" placeholder="{{ ('Section heading') }}" required />
            <textarea name="content_brief" class="textarea textarea-xs w-full" rows="2" placeholder="{{ ('Content brief') }}"></textarea>
            <button type="submit" class="btn btn-primary btn-xs">{{ ('Add') }}</button>
        </form>
    </details>
</div>
