{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 relative bg-base-200">
    <div class="absolute top-4 end-4">
        {% include "components/theme_switcher.html" %}
    </div>

    <div class="w-full max-w-sm">
        <div class="text-center mb-7">
            <span class="seoz-logo size-16 text-3xl mx-auto mb-4">{{ _('س') }}</span>
            <h1 class="text-2xl font-extrabold tracking-tight">{{ _('ورود به %(v)s') % {'v': app_name} }}</h1>
            <p class="text-sm opacity-55 mt-1">{{ _('پلتفرم اتوماسیون سئو و تولید محتوا') }}</p>
        </div>

        <!-- Native POST (hx-boost disabled): the session cookie is set on a
             full-page 303 redirect so mobile browsers (iOS ITP) keep it. -->
        <form method="post" action="/login" hx-boost="false" class="seoz-panel">
            <div class="p-5 flex flex-col gap-4">
                {% if error %}
                <div class="alert alert-soft alert-error text-sm" id="login-error">{{ error }}</div>
                {% endif %}

                <label class="floating-label">
                    <span>{{ _('ایمیل') }}</span>
                    <input type="email" name="email" class="input validator" placeholder="you@example.com" required autocomplete="email" />
                </label>

                <label class="floating-label">
                    <span>{{ _('رمز عبور') }}</span>
                    <input type="password" name="password" class="input validator" placeholder="••••••••" required autocomplete="current-password" />
                </label>

                <button type="submit" class="btn btn-primary w-full mt-2">{{ _('ورود') }}</button>
            </div>
        </form>

        <p class="text-center text-xs opacity-50 mt-6">{{ _('نسخه %(v)s') % {'v': app_version} }}</p>
    </div>
</div>
{% endblock %}
