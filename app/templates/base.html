<!doctype html>
<html lang="{{ locale.code }}" dir="{{ locale.direction }}">
    <head>
        <meta charset="UTF-8" />
        <script>
            /* Theme bootstrap — runs before first paint so the very first frame is
               already the resolved theme (no light/dark flash). Reads the persisted
               choice from localStorage; falls back to the OS preference. */
            (function () {
                var KEY = 'ezdistro-theme';
                var mode = 'light';
                try {
                    var stored = localStorage.getItem(KEY);
                    if (stored === 'light' || stored === 'dark') {
                        mode = stored;
                    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        mode = 'dark';
                    } else {
                        mode = 'light';
                    }
                } catch (e) {}
                var el = document.documentElement;
                el.dataset.theme = mode === 'dark' ? 'ezdistro-dark' : 'ezdistro';
                el.dataset.themeMode = mode;
                try {
                    var v = localStorage.getItem(KEY);
                    el.dataset.themeChoice = v === 'system' || v === 'light' || v === 'dark' ? v : 'system';
                } catch (e) {
                    el.dataset.themeChoice = 'system';
                }
            })();
        </script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="theme-color" content="#f4f2ec" />

        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" href="/favicon.ico" />

        <link
            rel="preload"
            href="{{ url_for('static', path='/assets/Arad-VF.woff2') }}"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <title>{{ title or _('EzDistro') }}</title>
        <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}" />

        <script>
            (function() {
                var BANNER_ID = 'offline-banner';
                var BANNER_TEXT = {{ _('⚠️ شما آفلاین هستید — داده‌های ذخیره‌شده نمایش داده می‌شود') | tojson }};
                function createBanner() {
                    var el = document.createElement('div');
                    el.id = BANNER_ID;
                    el.textContent = BANNER_TEXT;
                    el.style.cssText = 'position:fixed;top:0;left:50%;translate:-50%;z-index:99999;background:oklch(92% 0.05 75);color:oklch(40% 0.1 50);text-align:center;font-size:0.8rem;font-weight:700;padding:0.5rem 1rem;border-radius:0 0 0.75rem 0.75rem;max-width:600px;width:100%';
                    el.style.display = navigator.onLine ? 'none' : '';
                    document.body.prepend(el);
                }
                function updateBanner() {
                    var el = document.getElementById(BANNER_ID);
                    if (el) {
                        el.style.display = navigator.onLine ? 'none' : '';
                    } else if (!navigator.onLine) {
                        createBanner();
                    }
                }
                window.addEventListener('offline', createBanner);
                window.addEventListener('online', function() {
                    var el = document.getElementById(BANNER_ID);
                    if (el) el.style.display = 'none';
                });
                document.addEventListener('DOMContentLoaded', function() {
                    if (!navigator.onLine) createBanner();
                });
                var observer = new MutationObserver(function() {
                    if (!navigator.onLine && !document.getElementById(BANNER_ID)) {
                        createBanner();
                    }
                });
                if (document.body) {
                    observer.observe(document.body, { childList: true, subtree: false });
                } else {
                    document.addEventListener('DOMContentLoaded', function() {
                        observer.observe(document.body, { childList: true, subtree: false });
                    });
                }
            })();
        </script>
    </head>

    <body class="bg-base-200 font-sans antialiased" hx-boost="true">
        {% block body_start %}{% endblock %}

        <!-- Top loading progress bar — HIDDEN for now (kept intact for easy
             re-enable: just remove the `hidden` attribute below). -->
        <div
            id="top-progress-bar"
            hidden
            class="fixed top-0 start-0 h-0.5 bg-primary z-[9999] transition-all duration-300 ease-out w-0 opacity-0 pointer-events-none"
        ></div>

        {% block content %}{% endblock %}

        <div id="modal-container"></div>
        <div
            id="toast-container"
            class="fixed top-4 right-4 z-[60] flex w-[min(92vw,22rem)] flex-col gap-2"
            aria-live="polite"
            aria-atomic="false"
        ></div>

        <!-- Global confirmation dialog — replaces native window.confirm() for
             every hx-confirm action (driven by js/confirm-dialog.js). -->
        <dialog id="confirm-dialog" class="modal modal-bottom sm:modal-middle" hx-boost="false">
            <div class="modal-box bg-base-100">
                <div class="flex items-start gap-4">
                    <div class="shrink-0 grid size-11 place-items-center rounded-2xl bg-warning/15 text-warning">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h3 class="font-bold text-lg">{{ _('تأیید عملیات') }}</h3>
                        <p class="py-2 text-sm opacity-70 leading-relaxed" data-confirm-text></p>
                    </div>
                </div>
                <div class="modal-action flex gap-3">
                    <button type="button" class="btn btn-ghost flex-1" data-confirm-cancel>{{ _('انصراف') }}</button>
                    <button type="button" class="btn btn-error flex-1" data-confirm-ok>{{ _('تأیید') }}</button>
                </div>
            </div>
            <div class="modal-backdrop bg-black/40 backdrop-blur-sm cursor-pointer" data-confirm-backdrop></div>
        </dialog>

        {% block body_end %}{% endblock %}

        <script type="module" src="{{ url_for('static', path='/js/integrations.js') }}"></script>
        <script type="module" src="{{ url_for('static', path='/app.js') }}"></script>
        <script defer src="{{ url_for('static', path='/js/theme.js') }}"></script>
        <script defer src="{{ url_for('static', path='/js/confirm-dialog.js') }}"></script>

        <script>
            function getProgressBar() {
                return document.getElementById('top-progress-bar');
            }
            function startProgress() {
                const bar = getProgressBar();
                if (!bar) return;
                bar.style.transition = 'width 0.3s ease-out, opacity 0.1s ease-in';
                bar.style.opacity = '1';
                bar.style.width = '30%';
                setTimeout(() => {
                    if (bar.style.opacity === '1') bar.style.width = '70%';
                }, 400);
            }
            function stopProgress() {
                const bar = getProgressBar();
                if (!bar) return;
                bar.style.transition = 'width 0.2s ease-out, opacity 0.3s ease-out';
                bar.style.width = '100%';
                setTimeout(() => {
                    bar.style.opacity = '0';
                    setTimeout(() => {
                        bar.style.transition = 'none';
                        bar.style.width = '0%';
                    }, 300);
                }, 300);
            }
            document.addEventListener('htmx:beforeRequest', startProgress);
            document.addEventListener('htmx:afterSettle', stopProgress);
            window.addEventListener('beforeunload', startProgress);
            document.addEventListener('DOMContentLoaded', stopProgress);
        </script>

        <script>
            if (!window.toastListenerAttached) {
                const ICONS = {
                    info: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />',
                    success: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />',
                    error: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />',
                    warning: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />',
                };
                const ROLE = {
                    info: 'ezdistro-toast-info',
                    success: 'ezdistro-toast-success',
                    error: 'ezdistro-toast-error',
                    warning: 'ezdistro-toast-warning',
                };
                document.addEventListener('show-toast', function (evt) {
                    const detail = evt.detail || {};
                    const message = detail.message || '';
                    const type = detail.type || 'info';
                    const container = document.getElementById('toast-container');
                    if (!container) return;

                    const toast = document.createElement('div');
                    toast.className = `ezdistro-toast ${ROLE[type] || ROLE.info} translate-x-full opacity-0 transition-all duration-300`;
                    toast.setAttribute('role', 'status');
                    toast.innerHTML = `
                        <span class="ezdistro-toast-ico">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="size-5">${ICONS[type] || ICONS.info}</svg>
                        </span>
                        <span class="flex-1 text-sm font-medium">${message}</span>`;
                    container.appendChild(toast);
                    requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));
                    setTimeout(() => {
                        toast.classList.add('opacity-0', 'translate-x-8');
                        setTimeout(() => toast.remove(), 300);
                    }, 4200);
                });

                // Delayed Redirect Listener — toast animates, THEN navigate
                document.addEventListener('delayed-redirect', function (evt) {
                    const targetUrl = evt.detail && evt.detail.url;
                    if (!targetUrl) return;
                    setTimeout(() => { window.location.href = targetUrl; }, 1200);
                });

                // HTMX failure feedback — network errors and 4xx/5xx must never fail silently
                document.addEventListener('htmx:sendError', function () {
                    document.dispatchEvent(new CustomEvent('show-toast', {
                        detail: { message: {{ _('اتصال به سرور برقرار نشد. دوباره تلاش کنید.') | tojson }}, type: 'error' },
                    }));
                });
                document.addEventListener('htmx:responseError', function () {
                    document.dispatchEvent(new CustomEvent('show-toast', {
                        detail: { message: {{ _('مشکلی پیش آمد؛ دوباره تلاش کنید.') | tojson }}, type: 'error' },
                    }));
                });

                window.toastListenerAttached = true;
            }
        </script>

        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', async () => {
                    try {
                        const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
                        reg.addEventListener('updatefound', () => {
                            const newSW = reg.installing;
                            newSW.addEventListener('statechange', () => {
                                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                                    document.dispatchEvent(new CustomEvent('show-toast', {
                                        detail: { message: {{ _('نسخه جدید در دسترس است.') | tojson }}, type: 'info' },
                                    }));
                                }
                            });
                        });
                    } catch (err) {
                        console.error('SW registration failed:', err);
                    }
                });
            }
        </script>
    </body>
</html>
