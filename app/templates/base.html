{% if partial %}{{ self.content() }}{% else %}
<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <script>
            /* First paint follows the OS (Auto) unless the visitor picked a
               theme; a stored 'light'/'dark' wins over the system preference. */
            (function () {
                var KEY = 'ezdistro-theme';
                var stored = null;
                try {
                    stored = localStorage.getItem(KEY);
                } catch (e) {}
                var choice = stored === 'dark' || stored === 'light' ? stored : 'system';
                var mode = choice;
                if (choice === 'system') {
                    try {
                        mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                    } catch (e) {
                        mode = 'light';
                    }
                }
                var el = document.documentElement;
                el.dataset.theme = mode === 'dark' ? 'ezdistro-dark' : 'ezdistro';
                el.dataset.themeMode = mode;
                el.dataset.themeChoice = choice;
            })();
        </script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="theme-color" content="#ffffff" />

        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
        <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.svg" />

        <link
            rel="preload"
            href="{{ url_for('static', path='/assets/InterVariable.ttf') }}"
            as="font"
            type="font/ttf"
            crossorigin
        />

        <title>{{ title or ('EzDistro') }}</title>
        <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}" />
    </head>

    <body
        class="bg-base-100 font-sans antialiased"
        hx-boost="true"
        hx-target="#main-content"
        hx-swap="innerHTML show:window:top"
    >
        {% block body_start %}{% endblock %}

        <!-- Top loading progress bar — HIDDEN for now (kept intact for easy
             re-enable: just remove the `hidden` attribute below). -->
        <div
            id="top-progress-bar"
            hidden
            class="fixed top-0 start-0 h-0.5 bg-primary z-[9999] transition-all duration-300 ease-out w-0 opacity-0 pointer-events-none"
        ></div>

        {% block content %}{% endblock %}

        <div id="modal-container"></div>
        <div
            id="toast-container"
            class="pointer-events-none fixed top-4 end-4 z-[60] flex w-[min(92vw,22rem)] flex-col gap-2"
            aria-live="polite"
            aria-atomic="false"
        ></div>

        <!-- Global confirmation dialog — replaces native window.confirm() for
             every hx-confirm action (driven by js/confirm-dialog.js). -->
        <dialog id="confirm-dialog" class="modal modal-bottom sm:modal-middle" hx-boost="false">
            <div class="modal-box bg-base-100">
                <div class="flex items-start gap-4">
                    <div class="shrink-0 grid size-11 place-items-center rounded-lg bg-warning/15 text-warning">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h3 class="font-bold text-lg">{{ ('Confirm action') }}</h3>
                        <p class="py-2 text-sm opacity-70 leading-relaxed" data-confirm-text></p>
                    </div>
                </div>
                <div class="modal-action flex gap-3">
                    <button type="button" class="btn btn-ghost flex-1" data-confirm-cancel>{{ ('Cancel') }}</button>
                    <button type="button" class="btn btn-error flex-1" data-confirm-ok>{{ ('Confirm') }}</button>
                </div>
            </div>
            <div class="modal-backdrop bg-black/40 backdrop-blur-sm cursor-pointer" data-confirm-backdrop></div>
        </dialog>

        {% block body_end %}{% endblock %}

        <!-- Global UI store: client-only view state (modals, toasts). Server
             data stays on the server; this lives outside #main-content so it
             survives boosted navigation. -->
        <script>
            document.addEventListener('alpine:init', function () {
                Alpine.store('ui', {
                    openModal: function (id) {
                        var el = document.getElementById(id);
                        if (el && el.showModal) el.showModal();
                    },
                    closeModal: function (id) {
                        var el = document.getElementById(id);
                        if (el && el.close) el.close();
                    },
                    notify: function (message, type) {
                        document.dispatchEvent(new CustomEvent('show-toast', {
                            detail: { message: message, type: type || 'info' },
                        }));
                    },
                });
            });
        </script>

        <script type="module" src="{{ url_for('static', path='/js/integrations.js') }}"></script>
        <script type="module" src="{{ url_for('static', path='/app.js') }}"></script>
        <script defer src="{{ url_for('static', path='/js/theme.js') }}"></script>
        <script defer src="{{ url_for('static', path='/js/confirm-dialog.js') }}"></script>

        <script>
            function getProgressBar() {
                return document.getElementById('top-progress-bar');
            }
            function startProgress() {
                const bar = getProgressBar();
                if (!bar) return;
                bar.style.transition = 'width 0.3s ease-out, opacity 0.1s ease-in';
                bar.style.opacity = '1';
                bar.style.width = '30%';
                setTimeout(() => {
                    if (bar.style.opacity === '1') bar.style.width = '70%';
                }, 400);
            }
            function stopProgress() {
                const bar = getProgressBar();
                if (!bar) return;
                bar.style.transition = 'width 0.2s ease-out, opacity 0.3s ease-out';
                bar.style.width = '100%';
                setTimeout(() => {
                    bar.style.opacity = '0';
                    setTimeout(() => {
                        bar.style.transition = 'none';
                        bar.style.width = '0%';
                    }, 300);
                }, 300);
            }
            document.addEventListener('htmx:beforeRequest', startProgress);
            document.addEventListener('htmx:afterSettle', stopProgress);
            window.addEventListener('beforeunload', startProgress);
            document.addEventListener('DOMContentLoaded', stopProgress);
        </script>

        <script>
            if (!window.toastListenerAttached) {
                const ICONS = {
                    info: 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
                    success: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z',
                    error: 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z',
                    warning: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z',
                };
                const ROLE = {
                    info: 'ezdistro-toast-info',
                    success: 'ezdistro-toast-success',
                    error: 'ezdistro-toast-error',
                    warning: 'ezdistro-toast-warning',
                };
                document.addEventListener('show-toast', function (evt) {
                    const detail = evt.detail || {};
                    const message = String(detail.message || '');
                    if (!message) return;
                    const type = ROLE[detail.type] ? detail.type : 'info';
                    const container = document.getElementById('toast-container');
                    if (!container) return;

                    const toast = document.createElement('div');
                    const entryOffset = 'translate-x-full';
                    const exitOffset = 'translate-x-8';
                    toast.className = `ezdistro-toast ${ROLE[type]} ${entryOffset} opacity-0 transition-all duration-300`;
                    toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
                    toast.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');
                    toast.setAttribute('aria-atomic', 'true');

                    const icon = document.createElement('span');
                    icon.className = 'ezdistro-toast-ico';
                    icon.setAttribute('aria-hidden', 'true');
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('viewBox', '0 0 24 24');
                    svg.setAttribute('fill', 'none');
                    svg.setAttribute('stroke', 'currentColor');
                    svg.setAttribute('stroke-width', '2');
                    svg.setAttribute('stroke-linecap', 'round');
                    svg.setAttribute('stroke-linejoin', 'round');
                    svg.setAttribute('class', 'size-5');
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', ICONS[type]);
                    svg.appendChild(path);
                    icon.appendChild(svg);

                    const text = document.createElement('span');
                    text.className = 'min-w-0 flex-1 break-words text-sm leading-5';
                    text.textContent = message;
                    toast.append(icon, text);
                    container.appendChild(toast);
                    requestAnimationFrame(() => toast.classList.remove(entryOffset, 'opacity-0'));
                    setTimeout(() => {
                        toast.classList.add('opacity-0', exitOffset);
                        setTimeout(() => toast.remove(), 300);
                    }, 4200);
                });

                function showPendingToasts(root) {
                    const nodes = Array.from(root.querySelectorAll?.('[data-toast-message]') || []);
                    if (root.matches?.('[data-toast-message]')) nodes.unshift(root);
                    nodes.forEach((node) => {
                        document.dispatchEvent(new CustomEvent('show-toast', {
                            detail: {
                                message: node.dataset.toastMessage,
                                type: node.dataset.toastType || 'info',
                            },
                        }));
                        node.remove();
                    });
                }

                document.addEventListener('htmx:load', (evt) => {
                    if (evt.detail?.elt) showPendingToasts(evt.detail.elt);
                });
                showPendingToasts(document);

                // Delayed Redirect Listener — toast animates, THEN navigate
                document.addEventListener('delayed-redirect', function (evt) {
                    const targetUrl = evt.detail && evt.detail.url;
                    if (!targetUrl) return;
                    setTimeout(() => { window.location.href = targetUrl; }, 1200);
                });

                // HTMX failure feedback — network errors and 4xx/5xx must never fail silently
                document.addEventListener('htmx:sendError', function () {
                    document.dispatchEvent(new CustomEvent('show-toast', {
                        detail: { message: {{ ('Could not reach the server. Please try again.') | tojson }}, type: 'error' },
                    }));
                });
                document.addEventListener('htmx:responseError', function () {
                    document.dispatchEvent(new CustomEvent('show-toast', {
                        detail: { message: {{ ('Something went wrong; please try again.') | tojson }}, type: 'error' },
                    }));
                });

                const connectionToast = (message, type) => document.dispatchEvent(new CustomEvent('show-toast', {
                    detail: { message, type },
                }));
                const offlineMessage = {{ ('You are offline — showing cached data') | tojson }};
                window.addEventListener('offline', () => connectionToast(offlineMessage, 'warning'));
                window.addEventListener('online', () => connectionToast({{ ('Connection restored.') | tojson }}, 'success'));
                if (!navigator.onLine) connectionToast(offlineMessage, 'warning');

                window.toastListenerAttached = true;
            }
        </script>

        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', async () => {
                    try {
                        const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
                        reg.addEventListener('updatefound', () => {
                            const newSW = reg.installing;
                            newSW.addEventListener('statechange', () => {
                                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                                    document.dispatchEvent(new CustomEvent('show-toast', {
                                        detail: { message: {{ ('A new version is available.') | tojson }}, type: 'info' },
                                    }));
                                }
                            });
                        });
                    } catch (err) {
                        console.error('SW registration failed:', err);
                    }
                });
            }
        </script>
    </body>
</html>
{% endif %}
