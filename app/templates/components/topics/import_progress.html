<nav aria-label="{{ _('مراحل درون‌ریزی') }}" class="mb-1">
    <ol class="grid grid-cols-3 gap-2">
        {% set steps = [ _('افزودن موضوع‌ها'), _('نگاشت ستون‌ها'), _('مرور نتایج') ] %}
        {% for step in steps %}
        <li class="flex min-w-0 flex-col items-center gap-1.5 text-center" {% if loop.index == current_step %}aria-current="step"{% endif %}>
            <span class="grid size-8 place-items-center rounded-full border text-xs font-semibold {{ 'border-primary bg-primary/10 text-base-content' if loop.index <= current_step else 'border-base-300 text-base-content/50' }}">
                {% if loop.index < current_step %}<span aria-hidden="true">✓</span><span class="sr-only">{{ loop.index }}</span>{% else %}{{ loop.index }}{% endif %}
            </span>
            <span class="text-[0.65rem] leading-tight {{ 'font-semibold text-base-content' if loop.index == current_step else 'text-base-content/60' }}">{{ step }}</span>
        </li>
        {% endfor %}
    </ol>
</nav>
