# Extraction mapping for pybabel (make i18n-extract).
# Patterns are relative to the extraction dir passed on the CLI (`app`).
# Python sources: _() / ngettext() calls.
[python: **.py]

# Jinja2 templates: {{ _('...') }} — babel_extract recognizes gettext calls
# natively; skips <script>/<style> blocks automatically.
[jinja2.ext.babel_extract: templates/**.html]
encoding = utf-8
