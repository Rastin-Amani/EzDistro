[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = ["app/static", "tests", "app/scripts/benchmark.py", ".venv"]
disable_error_code = ["override"]

# structlog BoundLogger accepts **kwargs at runtime; this structlog version ships
# no mypy plugin, so keyword logging calls are exempted from call-arg checks.
[[tool.mypy.overrides]]
module = [
    "app.api.errors",
    "app.jobs.engine",
    "app.services.scheduler",
    "app.workers.worker",
    "app.logging_config",
    "app.middleware",
    "app.main",
    "app.providers.http",
    "app.providers.metrics",
    "app.services.indexing",
    "app.services.writing",
]
disable_error_code = ["call-arg", "arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
